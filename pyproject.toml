[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dualhand-vision"
version = "1.0.0"
authors = [
  { name="Shaayan Shah", email="shayanshah.edu.pk@gmail.com" },
]
description = "Real-time dual-hand tracking, 21-point skeletal landmarker, and rotation-invariant finger counting using computer vision."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "streamlit>=1.30.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]
